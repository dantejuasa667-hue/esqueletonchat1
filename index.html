<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EsqueletonChat</title>
<style>
:root{--bg:#eef6f0;--surface:#fff;--text:#1d2a22;--muted:#6f8577;--accent:#1f9d55;--accent-text:#fff;--mine:#1f9d55;--mine-text:#fff;--other:#e2efe6;--border:#d2e3d8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1611;--surface:#15211a;--text:#e8f3ec;--muted:#8fa89a;--accent:#3ddc84;--accent-text:#07140c;--mine:#1f9d55;--mine-text:#fff;--other:#21332a;--border:#2a3f32;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1611;--surface:#15211a;--text:#e8f3ec;--muted:#8fa89a;--accent:#3ddc84;--accent-text:#07140c;--mine:#1f9d55;--mine-text:#fff;--other:#21332a;--border:#2a3f32;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);display:flex;justify-content:center}
.app{--ff:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--fs:14px;font-family:var(--ff);font-size:var(--fs);line-height:1.4;width:100%;max-width:720px;height:100%;display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--border);border-right:1px solid var(--border);position:relative}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border)}
header h1{font-size:1.3em;margin:0;flex:1}
.dot{width:10px;height:10px;border-radius:50%;background:#2fbf71}.dot.off{background:var(--muted)}
.status{font-size:.85em;color:var(--muted)}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.empty{margin:auto;color:var(--muted);text-align:center}
.m{max-width:78%;padding:8px 12px;border-radius:16px;background:var(--other);align-self:flex-start;overflow-wrap:anywhere}
.m.me{background:var(--mine);color:var(--mine-text);align-self:flex-end}
.m .who{font-size:.85em;font-weight:700;opacity:.75;margin-bottom:2px}
.m .t{font-size:.78em;opacity:.6;text-align:right;margin-top:2px}
form.bar{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);position:relative}
input,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:10px 14px;outline:none;min-width:0}
form.bar input{flex:1;border-radius:22px;padding:10px 16px}
input:focus,select:focus{border-color:var(--accent)}
button{font:inherit;border:0;border-radius:22px;padding:10px 18px;background:var(--accent);color:var(--accent-text);cursor:pointer;font-weight:700}
button.ghost{background:var(--other);color:var(--text)}
.eb-toggle{background:var(--other);color:var(--text);padding:8px 12px;font-size:20px;line-height:1}
#panel{position:absolute;bottom:calc(100% + 6px);left:12px;display:grid;grid-template-columns:repeat(4,60px);gap:6px;padding:10px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.2);max-width:calc(100% - 24px)}
[hidden]{display:none!important}
.eb{background:transparent;padding:4px;border-radius:10px;height:60px;display:flex;align-items:center;justify-content:center}
.eb:hover{background:var(--other)}.eb img{max-width:100%;max-height:100%}
.emo{height:1.9em;width:auto;vertical-align:middle;margin:0 1px}.big .emo{height:64px}
.overlay{position:absolute;inset:0;background:var(--surface);z-index:5;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;text-align:center}
.tabs{display:flex;gap:6px}.tabs button{flex:1;background:var(--other);color:var(--text)}.tabs button.on{background:var(--accent);color:var(--accent-text)}
.err{color:#d64545;min-height:1.2em;font-size:.9em;text-align:center}
.note{color:var(--muted);font-size:.8em;text-align:center}
#settings{padding:12px 16px;border-bottom:1px solid var(--border);background:var(--bg);display:flex;flex-direction:column;gap:10px}
#settings label{display:flex;align-items:center;gap:10px}#settings label span{min-width:70px}
#settings input[type=range]{flex:1;padding:0;accent-color:var(--accent)}
.row{display:flex;gap:8px;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="overlay" id="auth">
    <div class="card">
      <h2>💀 EsqueletonChat</h2>
      <div class="tabs"><button type="button" id="tabIn" class="on">Entrar</button><button type="button" id="tabUp">Crear cuenta</button></div>
      <input id="user" placeholder="Nombre de usuario" maxlength="16" autocomplete="username" autocapitalize="none">
      <input id="pass" type="password" placeholder="Contraseña" maxlength="40" autocomplete="current-password">
      <button type="button" id="go">Entrar</button>
      <div class="err" id="err"></div>
      <div class="note">Usuario: 3–16 letras, números o _. Contraseña: mínimo 4 caracteres.</div>
    </div>
  </div>
  <header>
    <span class="dot off" id="dot"></span>
    <h1>💀 EsqueletonChat</h1>
    <span class="status" id="status">Conectando…</span>
    <button type="button" class="ghost" id="gear" hidden aria-label="Ajustes">⚙️</button>
  </header>
  <div id="settings" hidden>
    <div class="row"><b id="acct"></b><button type="button" class="ghost" id="logout">Cerrar sesión</button></div>
    <label><span>Letra</span><select id="font" style="flex:1"></select></label>
    <label><span>Tamaño</span><input type="range" id="size" min="10" max="14" step="1"><b id="sizeV"></b></label>
  </div>
  <div id="msgs"></div>
  <form class="bar" id="form">
    <div id="panel" hidden></div>
    <button type="button" class="eb-toggle" id="emoBtn" aria-label="Emojis">💀</button>
    <input id="text" placeholder="Escribe un mensaje…" maxlength="500" autocomplete="off">
    <button type="submit">Enviar</button>
  </form>
</div>

  var FONTS={

  var db=null, me=null, list=[], unsub=null, mode='in';

  /* ---------- hash ---------- */
  function cyrb(s){var h1=0xdeadbeef,h2=0x41c6ce57,c;for(var i=0;i<s.length;i++){c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}
    h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
    return (4294967296*(2097151&h2)+(h1>>>0)).toString(16);}
  function hash(salt,pw){
    var s=salt+':'+pw;
    try{ if(window.crypto&&crypto.subtle&&window.TextEncoder){
      return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){
        return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');});
    }}catch(e){}
    return Promise.resolve('c'+cyrb(s));
  }

  /* ---------- almacenamiento de cuentas ---------- */
  function getAcc(id){
    if(db) return db.doc('accounts/'+id).get().then(function(s){return s.exists?s.data():null;});
    try{var v=localStorage.getItem('esq-acc-'+id);return Promise.resolve(v?JSON.parse(v):null);}catch(e){return Promise.resolve(null);}
  }
  function countAcc(){
    if(db) return db.collection('accounts').get().then(function(s){return s.size;});
    var n=0;try{for(var i=0;i<localStorage.length;i++){if(localStorage.key(i).indexOf('esq-acc-')===0)n++;}}catch(e){}
    return Promise.resolve(n);
  }
  function putAcc(id,data){
    if(db) return db.doc('accounts/'+id).set(data);
    try{localStorage.setItem('esq-acc-'+id,JSON.stringify(data));}catch(e){}
    return Promise.resolve();
  }
  function saveSettings(){
    if(!me) return;
    var d={font:me.font,size:me.size};
    if(db) db.doc('accounts/'+me.id).update(d).catch(function(){});
    else getAcc(me.id).then(function(a){if(a){a.font=me.font;a.size=me.size;putAcc(me.id,a);}});
  }

  /* ---------- ajustes de letra ---------- */
  var fsel=$('font');
  Object.keys(FONTS).forEach(function(k){var o=document.createElement('option');o.value=k;o.textContent=FONTS[k][0];fsel.appendChild(o);});
  function clampSize(n){n=parseInt(n,10);if(isNaN(n))n=14;return Math.min(14,Math.max(10,n));}
  function applySettings(){
    var f=FONTS[me.font]?me.font:'sistema', s=clampSize(me.size);
    me.font=f;me.size=s;
    app.style.setProperty('--ff',FONTS[f][1]);app.style.setProperty('--fs',s+'px');
    fsel.value=f;$('size').value=s;$('sizeV').textContent=s+' px';
    $('acct').textContent='Cuenta #'+me.num+' · '+me.name;
  }
  fsel.onchange=function(){me.font=fsel.value;applySettings();saveSettings();};
  $('size').oninput=function(){me.size=clampSize(this.value);applySettings();};
  $('size').onchange=function(){saveSettings();};
  $('gear').onclick=function(){$('settings').hidden=!$('settings').hidden;};

  /* ---------- sesión ---------- */
  function startSession(acc,id){
    me={id:id,name:acc.name,num:acc.num,font:acc.font,size:acc.size,hash:acc.hash};
    try{localStorage.setItem('esq-session',JSON.stringify({id:id,hash:acc.hash}));}catch(e){}
    applySettings();
    $('auth').hidden=true;$('gear').hidden=false;$('pass').value='';
    subscribe();render();textIn.focus();
  }
  $('logout').onclick=function(){
    try{localStorage.removeItem('esq-session');}catch(e){}
    if(unsub){unsub();unsub=null;}
    me=null;list=[];$('settings').hidden=true;$('gear').hidden=true;$('auth').hidden=false;
    app.style.setProperty('--ff',FONTS.sistema[1]);app.style.setProperty('--fs','14px');
  };
  function setMode(m){
    mode=m;$('tabIn').className=m==='in'?'on':'';$('tabUp').className=m==='up'?'on':'';
    $('go').textContent=m==='in'?'Entrar':'Crear cuenta';$('err').textContent='';
    $('pass').autocomplete=m==='in'?'current-password':'new-password';
  }
  $('tabIn').onclick=function(){setMode('in');};
  $('tabUp').onclick=function(){setMode('up');};
  function fail(t){$('err').textContent=t;$('go').disabled=false;}
  function submitAuth(){
    var name=$('user').value.trim(), pw=$('pass').value;
    if(!/^[A-Za-z0-9_]{3,16}$/.test(name)) return fail('Usuario: 3–16 letras, números o _');
    if(pw.length<4) return fail('La contraseña debe tener al menos 4 caracteres');
    var id=name.toLowerCase();$('go').disabled=true;$('err').textContent='';
    getAcc(id).then(function(acc){
      if(mode==='in'){
        if(!acc) return fail('Esa cuenta no existe');
        return hash(acc.salt,pw).then(function(h){
          if(h!==acc.hash) return fail('Contraseña incorrecta');
          $('go').disabled=false;startSession(acc,id);
        });
      }
      if(acc) return fail('Ese nombre ya está en uso');
      var salt=Math.random().toString(36).slice(2)+Date.now().toString(36);
      return Promise.all([hash(salt,pw),countAcc()]).then(function(r){
        var a={name:name,num:r[1]+1,salt:salt,hash:r[0],font:'sistema',size:14,created:Date.now()};
        return putAcc(id,a).then(function(){$('go').disabled=false;startSession(a,id);});
      });
    }).catch(function(){fail('Error de conexión, intenta de nuevo');});
  }
  $('go').onclick=submitAuth;
  $('pass').onkeydown=$('user').onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();submitAuth();}};

  /* ---------- chat ---------- */
  var EMAP={};EMOJIS.forEach(function(e){EMAP[e.id]=e;});
  var panel=$('panel');
  EMOJIS.forEach(function(e){var b=document.createElement('button');b.type='button';b.className='eb';b.title=e.name;var im=document.createElement('img');im.src=e.src;im.alt=e.name;b.appendChild(im);b.onclick=function(){textIn.value+=':'+e.id+': ';textIn.focus();};panel.appendChild(b);});
  $('emoBtn').onclick=function(){panel.hidden=!panel.hidden;};
  function fmt(ts){return new Date(ts).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});}
  function render(){
    msgsEl.textContent='';
    if(!list.length){var e=document.createElement('div');e.className='empty';e.textContent='Aún no hay mensajes. ¡Escribe el primero!';msgsEl.appendChild(e);return;}
    list.forEach(function(m){
      var mine=me&&m.uid===me.id;
      var d=document.createElement('div');d.className='m'+(mine?' me':'');
      if(!mine){var w=document.createElement('div');w.className='who';w.textContent=(m.name||'Anónimo')+(m.num?' #'+m.num:'');d.appendChild(w);}
      var p=document.createElement('div');
      if(/^(\s*:e[1-7]:)+\s*$/.test(m.text)) p.className='big';
      String(m.text).split(/(:e[1-7]:)/).forEach(function(part){
        var k=part.slice(1,-1);
        if(/^:e[1-7]:$/.test(part)&&EMAP[k]){var im=document.createElement('img');im.className='emo';im.src=EMAP[k].src;im.alt=EMAP[k].name;p.appendChild(im);}
        else if(part){p.appendChild(document.createTextNode(part));}
      });
      d.appendChild(p);
      var t=document.createElement('div');t.className='t';t.textContent=fmt(m.ts);d.appendChild(t);
      msgsEl.appendChild(d);
    });
    msgsEl.scrollTop=msgsEl.scrollHeight;
  }
  $('form').onsubmit=function(e){
    e.preventDefault();
    var v=textIn.value.trim();if(!v||!me) return;
    var msg={text:v,name:me.name,num:me.num,uid:me.id,ts:Date.now()};
    textIn.value='';
    if(db) db.collection('messages').add(msg).catch(function(){statusEl.textContent='No se pudo enviar';});
    else{list.push(msg);render();}
  };
  function subscribe(){
    if(!db||unsub) return;
    unsub=db.collection('messages').orderBy('ts','asc').limit(200).onSnapshot(function(s){
      list=s.docs.map(function(d){return d.data();});
      dot.classList.remove('off');statusEl.textContent='En línea';render();
    },function(){dot.classList.add('off');statusEl.textContent='Sin conexión';});
  }

  /* ---------- arranque ---------- */
  function loadScript(src){return new Promise(function(ok,no){var s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s);});}
  var ready=new Promise(function(res){
    var t=setTimeout(function(){res(null);},8000);
    function done(d){clearTimeout(t);res(d);}
    var cfg=window.FIREBASE_CONFIG;
    if(cfg&&cfg.apiKey){

      loadScript(V+'firebase-app-compat.js').then(function(){return loadScript(V+'firebase-firestore-compat.js');})

    } else if(window.claude&&claude.use){
      claude.use('db').then(done).catch(function(){done(null);});
    } else { done(null); }
  });
  render();
  ready.then(function(d){
    db=d;
    if(!db) statusEl.textContent='Modo local';
    var s=null;try{s=JSON.parse(localStorage.getItem('esq-session')||'null');}catch(e){}
    if(!s) return;
    return getAcc(s.id).then(function(acc){if(acc&&acc.hash===s.hash) startSession(acc,s.id);});
  }).catch(function(){});
})();
</script>
</body>
</html>
